<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151f">
  <title>KI-Training live</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #10151f;
      color: #f0f5ff;
      font-variant-numeric: tabular-nums;
      --surface: #192231;
      --line: #313d51;
      --muted: #b2bfd3;
      --accent: #9beed6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 850px; margin: auto; padding: clamp(24px, 7vw, 76px) 20px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(1.85rem, 6vw, 3rem); line-height: 1.08; letter-spacing: -.05em; }
    .status { display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 99px; padding: 7px 12px; font-size: .875rem; color: var(--muted); }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .status[data-state="running"], .status[data-state="complete"] { color: var(--accent); }
    .status[data-state="stale"], .status[data-state="paused"] { color: #ffdb96; }
    .progress { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(18px, 5vw, 36px); }
    h2 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--muted); }
    .percent { display: block; margin: 8px 0 14px; color: var(--accent); font-size: clamp(3rem, 13vw, 6rem); font-weight: 650; line-height: 1; letter-spacing: -.065em; }
    progress { display: block; width: 100%; height: 10px; appearance: none; border: 0; border-radius: 99px; background: #344158; accent-color: var(--accent); }
    progress::-webkit-progress-bar { background: #344158; border-radius: 99px; }
    progress::-webkit-progress-value { background: var(--accent); border-radius: 99px; }
    progress::-moz-progress-bar { background: var(--accent); border-radius: 99px; }
    .steps { margin: 13px 0 0; color: var(--muted); }
    dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 12px 0 0; }
    dl > div { border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    dt { color: var(--muted); font-size: .875rem; }
    dd { margin: 6px 0 0; font-size: 1.4rem; font-weight: 600; }
    footer { color: var(--muted); margin-top: 18px; font-size: .875rem; line-height: 1.5; }
    footer p { margin: 4px 0; }
    @media (max-width: 520px) {
      dl { grid-template-columns: 1fr; }
      dl > div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 16px; }
      dd { margin: 0; font-size: 1.15rem; text-align: right; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>KI-Training live</h1>
      <span class="status" id="status" role="status">Wird geladen</span>
    </header>
    <section class="progress" aria-labelledby="progress-heading">
      <h2 id="progress-heading">Trainingsfortschritt</h2>
      <strong class="percent" id="percent">–</strong>
      <progress id="progress" max="100" value="0" aria-labelledby="progress-heading"></progress>
      <p class="steps" id="steps"></p>
    </section>
    <dl>
      <div><dt>Voraussichtlich fertig</dt><dd id="eta">–</dd></div>
      <div><dt>Token pro Sekunde</dt><dd id="rate">–</dd></div>
      <div><dt>Prüfverlust</dt><dd id="validation">–</dd></div>
    </dl>
    <footer>
      <p id="updated"></p>
      <p id="connection" role="status"></p>
    </footer>
  </main>
  <script>
    const endpoint = "https://api.github.com/repos/Elias296/ki-training-live/contents/status.json?ref=status";
    const refreshInterval = 75_000;
    const staleAfter = 4 * 60_000;
    const number = new Intl.NumberFormat("de-DE");
    const percent = new Intl.NumberFormat("de-DE", { style: "percent", maximumFractionDigits: 1 });
    const loss = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 3, maximumFractionDigits: 3 });
    const clock = new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" });
    const dateAndTime = new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", dateStyle: "medium", timeStyle: "short" });
    const field = (id) => document.getElementById(id);
    let snapshot;

    function showStatus(state, label) {
      field("status").dataset.state = state;
      field("status").textContent = label;
    }

    function render() {
      const timestamp = Date.parse(snapshot.updatedAt);
      const stale = snapshot.state !== "complete" && Date.now() - timestamp > staleAfter;
      const fraction = Math.min(1, snapshot.step / snapshot.total);
      const labels = { running: "Läuft", complete: "Abgeschlossen", paused: "Fortschritt pausiert" };
      showStatus(stale ? "stale" : snapshot.state, stale ? "Stand veraltet" : labels[snapshot.state]);
      field("percent").textContent = percent.format(fraction);
      field("progress").value = fraction * 100;
      field("steps").textContent = `Schritt ${number.format(snapshot.step)} von ${number.format(snapshot.total)}`;
      field("rate").textContent = Number.isFinite(snapshot.tokensPerSecond) ? number.format(snapshot.tokensPerSecond) : "–";
      field("validation").textContent = Number.isFinite(snapshot.validationLoss) ? loss.format(snapshot.validationLoss) : "–";
      field("eta").textContent = snapshot.state === "running" && !stale && Number.isFinite(snapshot.etaHours)
        ? `${clock.format(timestamp + snapshot.etaHours * 3_600_000)} Uhr` : "–";
      field("updated").textContent = `Letzte Meldung am ${dateAndTime.format(timestamp)} Uhr (Berlin)`;
    }

    async function refresh() {
      try {
        const response = await fetch(endpoint, {
          headers: { Accept: "application/vnd.github.raw+json" },
          cache: "no-store"
        });
        if (!response.ok) throw new Error(`GitHub HTTP ${response.status}`);
        const next = await response.json();
        if (!Number.isInteger(next.step) || next.step < 0 || !Number.isInteger(next.total) || next.total <= 0 ||
            !Number.isFinite(Date.parse(next.updatedAt)) || !["running", "paused", "complete"].includes(next.state)) {
          throw new Error("Ungültiger Trainingsstand");
        }
        if (!snapshot || Date.parse(next.updatedAt) >= Date.parse(snapshot.updatedAt)) snapshot = next;
        render();
        field("connection").textContent = "";
      } catch {
        if (snapshot) render();
        else showStatus("stale", "Stand nicht verfügbar");
        field("connection").textContent = "Abruf fehlgeschlagen. Die Seite versucht es automatisch erneut.";
      } finally {
        if (snapshot?.state !== "complete") window.setTimeout(refresh, refreshInterval);
      }
    }

    refresh();
  </script>
</body>
</html>
